
name: Aggiorna dati Hurricane Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: hurricane-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recupera i dati NOAA
        run: python engine.py

      - name: Verifica il JSON prodotto
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("storms.json")
          if not path.exists():
              raise SystemExit("ERRORE: storms.json non esiste")

          data = json.loads(path.read_text(encoding="utf-8"))

          if data.get("status") != "ok":
              raise SystemExit("ERRORE: stato del JSON non valido")

          layers = data.get("layers")
          if not isinstance(layers, dict):
              raise SystemExit("ERRORE: livelli mancanti")

          for name in (
              "forecast_points",
              "forecast_track",
              "forecast_cone",
          ):
              layer = layers.get(name)
              if not isinstance(layer, dict):
                  raise SystemExit(f"ERRORE: livello {name} mancante")
              if layer.get("type") != "FeatureCollection":
                  raise SystemExit(f"ERRORE: GeoJSON {name} non valido")
              if not isinstance(layer.get("features"), list):
                  raise SystemExit(f"ERRORE: features {name} non valide")

          print("JSON valido.")
          print("Conteggi:", data.get("counts", {}))
          PY

      - name: Pubblica i dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storms.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati da pubblicare."
          else
            git commit -m "Aggiorna dati NOAA Hurricane Tracker"
            git push
          fi
          
