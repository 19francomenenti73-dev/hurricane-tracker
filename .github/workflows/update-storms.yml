name: Aggiornamento Automatico Cicloni

on:
  schedule:
    - cron: '0 */12 * * *' # Esegue il task automaticamente ogni 12 ore
  workflow_dispatch:      # Mantiene anche la possibilità di esecuzione manuale

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esecuzione motore di recupero dati
        run: python engine.py

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add storms.json
          git diff --staged --quiet || (git commit -m "Aggiornamento automatico dati tempeste [skip ci]" && git push)
          
