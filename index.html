<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowcasting Italia - Global Tropical Tracker</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100vh; background: #0f172a; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .tracker-header {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 12px; border-radius: 8px;
    }
    .tracker-header h1 { font-size: 13px; font-weight: 700; color: #38bdf8; }
    .tracker-header p { font-size: 9px; color: #94a3b8; }

    .tracker-panel {
      position: absolute; bottom: 12px; right: 12px; z-index: 1000; max-width: 320px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px; border-radius: 8px; font-size: 9px; color: #cbd5e1;
    }
    .status-text { font-size: 9px; font-weight: 600; margin-top: 4px; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="tracker-header">
    <h1>Global Tropical Storm Tracker</h1>
    <p>Nowcasting Italia — Real-Time Monitor</p>
  </div>

  <div class="tracker-panel">
    <div style="font-weight: bold; color: #38bdf8;">Fonte Dati: NOAA / NHC Official FeatureServer</div>
    <div id="tracker-status" class="status-text">● Inizializzazione mappa...</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS & Esri Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

  <script>
    // Inizializzazione mappa
    const map = L.map('map', { center: [20.0, -40.0], zoom: 3, worldCopyJump: true });

    // Base map Esri Scuro
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 16
    }).addTo(map);

    const statusElem = document.getElementById('tracker-status');

    // Query diretta e protetta al FeatureServer NOAA
    try {
      L.esri.query({
        url: 'https://services9.arcgis.com/RHVPKK2913V4675B/arcgis/rest/services/Active_Hurricanes_v1/FeatureServer/0'
      }).run(function (error, featureCollection) {
        if (error) {
          console.warn("Avviso connessione dati:", error);
          statusElem.innerText = "● Monitor attivo (Server NOAA momentaneamente non raggiungibile)";
          statusElem.style.color = "#f59e0b";
          return;
        }

        const count = (featureCollection && featureCollection.features) ? featureCollection.features.length : 0;

        if (count > 0) {
          statusElem.innerText = `● Cicloni/Tempeste attive rilevate: ${count}`;
          statusElem.style.color = "#ef4444";

          L.geoJSON(featureCollection, {
            pointToLayer: function (feature, latlng) {
              return L.circleMarker(latlng, {
                radius: 9, fillColor: "#ef4444", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9
              });
            },
            onEachFeature: function (feature, layer) {
              const p = feature.properties || {};
              const name = p.STORMNAME || p.NAME || 'SISTEMA TROPICALE';
              const intensity = p.INTENSITY || p.MAXWIND || 'N/D';
              const pressure = p.MSLP || 'N/D';

              layer.bindPopup(`
                <div style="color: #000; font-size: 11px;">
                  <strong style="font-size: 13px; color: #dc2626;">${name}</strong><br>
                  <b>Vento max:</b> ${intensity} kts<br>
                  <b>Pressione:</b> ${pressure} hPa
                </div>
              `);
            }
          }).addTo(map);
        } else {
          statusElem.innerText = "● Monitor attivo (Nessun ciclone tropicale attivo al momento)";
          statusElem.style.color = "#4ade80";
        }
      });
    } catch (e) {
      console.error("Eccezione di caricamento:", e);
      statusElem.innerText = "● Errore di caricamento del modulo";
      statusElem.style.color = "#ef4444";
    }

    // Resize di sicurezza
    setTimeout(() => { map.invalidateSize(); }, 500);
  </script>
</body>
</html>
